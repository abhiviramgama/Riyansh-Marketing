<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#292A30" />
  <!-- Overlapping Diamond emblem -->
  <g transform="translate(50, 48) scale(0.65)">
    <!-- Left diamond path -->
    <path d="M -18 32 L -34 16 L -18 0 L -2 16" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center connecting diagonal -->
    <path d="M -18 0 L 18 36" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <!-- Right diamond path -->
    <path d="M 2 20 L 18 36 L 34 20 L 18 4" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Red vertical accent -->
    <polygon points="-1,12 3,16 3,24 -1,20" fill="#B52B35" />
    <!-- R text -->
    <text x="-21" y="22" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">R</text>
    <!-- M text -->
    <text x="21" y="22" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">M</text>
  </g>
</svg>